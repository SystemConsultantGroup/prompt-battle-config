apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-battle-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prompt-battle
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prompt-battle
    spec:
      containers:
      - image: stringju/scg-prompt-battle-prod
        imagePullPolicy: Always
        name: prompt-battle
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        envFrom:
        - secretRef:
            name: prompt-battle-secret
